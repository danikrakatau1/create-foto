<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Create Foto — AI Image Lab</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#090b10;
      --panel:#11151d;
      --panel-2:#151a24;
      --line:#252c39;
      --text:#f5f7fb;
      --muted:#9099aa;
      --accent:#8b7cff;
      --ok:#6ee7a8;
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      min-height:100dvh;
      background:
        radial-gradient(circle at 15% -10%,rgba(139,124,255,.14),transparent 32rem),
        radial-gradient(circle at 100% 0%,rgba(70,180,255,.08),transparent 28rem),
        var(--bg);
    }
    button{font:inherit}
    .app{width:min(1500px,100%);margin:0 auto;padding:18px;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:13px 15px;border:1px solid var(--line);border-radius:18px;
      background:rgba(17,21,29,.78);backdrop-filter:blur(18px);
      box-shadow:0 16px 50px rgba(0,0,0,.22)
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#8b7cff,#5a72ff);box-shadow:0 8px 28px rgba(111,98,255,.28);font-weight:900;letter-spacing:-.04em}
    .brand-copy{min-width:0}
    .brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:750;letter-spacing:.01em}
    .brand p{font-size:12px;line-height:1.35;margin:3px 0 0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .status{display:inline-flex;align-items:center;gap:7px;color:#b6c0cf;font-size:12px;padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:#0d1118}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px rgba(110,231,168,.6)}
    .btn{border:1px solid var(--line);background:#171c26;color:var(--text);padding:9px 12px;border-radius:11px;cursor:pointer;transition:.18s ease}
    .btn:hover{transform:translateY(-1px);background:#1c2230;border-color:#354052}
    .btn:active{transform:translateY(0)}
    .workspace{position:relative;flex:1;min-height:680px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#0e1117;box-shadow:0 24px 80px rgba(0,0,0,.32)}
    .frame-head{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#11151d;color:#aab3c1;font-size:12px}
    .frame-title{display:flex;align-items:center;gap:8px}
    .frame-title strong{color:#e9edf5;font-weight:650}
    .hint{color:#737e90;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .frame-wrap{position:absolute;inset:44px 0 0;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loader{position:absolute;inset:44px 0 0;display:grid;place-items:center;background:#0f131a;z-index:2;transition:opacity .28s ease,visibility .28s ease}
    .loader.hide{opacity:0;visibility:hidden;pointer-events:none}
    .loading-card{display:flex;align-items:center;gap:11px;color:#b4bdcb;font-size:13px}
    .spinner{width:20px;height:20px;border:2px solid #303847;border-top-color:#9d91ff;border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer{display:flex;justify-content:space-between;gap:12px;color:#707b8c;font-size:11px;padding:0 4px 4px}
    .footer b{font-weight:600;color:#9aa5b6}
    @media (max-width:760px){
      .app{padding:8px;gap:8px}
      .topbar{padding:10px;border-radius:15px}
      .brand p,.status,.hint{display:none}
      .logo{width:34px;height:34px;border-radius:10px}
      .actions{gap:6px}
      .btn{padding:8px 10px;font-size:12px}
      .workspace{min-height:calc(100dvh - 78px);border-radius:16px}
      .frame-head{height:38px;padding:0 10px}
      .frame-wrap,.loader{inset:38px 0 0}
      .footer{display:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">CF</div>
        <div class="brand-copy">
          <h1>Create Foto</h1>
          <p>AI Image Lab · Perchance embedded inside our workspace</p>
        </div>
      </div>
      <div class="actions">
        <span class="status"><span class="dot"></span> Generator online</span>
        <button class="btn" id="reloadBtn" type="button">Reload</button>
        <button class="btn" id="fullscreenBtn" type="button">Fullscreen</button>
      </div>
    </header>

    <section class="workspace" id="workspace">
      <div class="frame-head">
        <div class="frame-title"><strong>Generator</strong><span>· Perchance</span></div>
        <div class="hint">Generate di panel ini — tetap berada di web Create Foto</div>
      </div>

      <div class="loader" id="loader">
        <div class="loading-card"><span class="spinner"></span><span>Memuat generator…</span></div>
      </div>

      <div class="frame-wrap">
        <iframe
          id="generatorFrame"
          title="Perchance AI Image Generator"
          src="https://image-generation.perchance.org/embed"
          allow="clipboard-read; clipboard-write; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </section>

    <footer class="footer">
      <span><b>V0.1</b> · Embedded generator test</span>
      <span>GitHub → Surge auto deploy</span>
    </footer>
  </main>

  <script>
    const frame = document.getElementById('generatorFrame');
    const loader = document.getElementById('loader');
    const workspace = document.getElementById('workspace');

    frame.addEventListener('load', () => loader.classList.add('hide'));

    document.getElementById('reloadBtn').addEventListener('click', () => {
      loader.classList.remove('hide');
      frame.src = frame.src;
    });

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await workspace.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });
  </script>
</body>
</html>
