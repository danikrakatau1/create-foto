name: Render Japanese Scene MP4

on:
  push:
    branches:
      - main
    paths:
      - "remotion-japanese/**"
      - ".github/workflows/render-japanese.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download corrected artwork assets from Adobe Creative Cloud
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remotion-japanese/public/assets

          fetch_asset() {
            local url="$1"
            local target="$2"
            echo "Downloading ${target}"
            curl --fail --location --retry 3 --retry-delay 2 "$url" --output "remotion-japanese/public/assets/${target}"
            test -s "remotion-japanese/public/assets/${target}"
          }

          fetch_asset "https://at.adobe.com/rBByVjy7H6u3EObB" "background-main.jpg"
          fetch_asset "https://at.adobe.com/wCqufCmJrtBeUvFA" "fuji-main.png"

          fetch_asset "https://at.adobe.com/WOGZZgNn5VJyrjja" "pine-left.png"
          fetch_asset "https://at.adobe.com/HwbfQ8UXXqW2f6iW" "pine-right.png"
          fetch_asset "https://at.adobe.com/SKqugUSrdur0h7fM" "pine-center.png"

          fetch_asset "https://at.adobe.com/ZrUJg0xRr4rfjsLt" "cloud-01.png"
          fetch_asset "https://at.adobe.com/ANmK9B6UYKpXc4CJ" "cloud-02.png"

          fetch_asset "https://at.adobe.com/thck3O41j59sSbCP" "sakura-top-left.png"
          fetch_asset "https://at.adobe.com/KptmDxaNGX2dXTiN" "sakura-top-right.png"
          fetch_asset "https://at.adobe.com/cUpUpeZedlABpf5H" "sakura-side-right.png"

          fetch_asset "https://at.adobe.com/3Uh45cSUSyxQzXpH" "peony-left.png"
          fetch_asset "https://at.adobe.com/SNDRUuzTGtdtSbjs" "peony-center.png"
          fetch_asset "https://at.adobe.com/7qECzt0ien2m3F4i" "peony-right.png"

      - name: Install Remotion dependencies
        working-directory: remotion-japanese
        run: npm install --no-audit --no-fund

      - name: Render MP4
        working-directory: remotion-japanese
        run: npm run render

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: japanese-scene-mp4
          path: remotion-japanese/out/japanese-scene.mp4
          if-no-files-found: error
          retention-days: 7
