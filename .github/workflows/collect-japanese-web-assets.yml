name: Collect Japanese Web Reference Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-japanese-web-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download life-motion reference assets
        shell: bash
        run: |
          set -euo pipefail
          OUT="japanese-life-motion-assets"
          mkdir -p "$OUT"

          fetch_optional() {
            local source="$1"
            local target="$2"
            echo "Downloading $target"
            if curl --fail --location --max-time 25 --retry 2 --retry-delay 2 "$source" --output "$OUT/$target"; then
              test -s "$OUT/$target" || rm -f "$OUT/$target"
            else
              echo "WARN: failed $target" >&2
              rm -f "$OUT/$target"
            fi
          }

          # Petals — tiny motion only
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Petal.svg" "life-petal.svg"
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Simple_petal.svg" "life-simple-petal.svg"

          # Birds / cranes — far background motion
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Crane_illustration.svg" "life-crane-illustration-cc0.svg"
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bird_flying_Pinhead_icon.svg" "life-bird-flying-pinhead-cc0.svg"
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bird_template.svg" "life-bird-template-public-domain.svg"
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/FlightSilhouettes.svg" "life-flight-silhouettes.svg"
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bird01.svg" "life-bird01.svg"

          # Atmosphere reference / mask
          fetch_optional "https://commons.wikimedia.org/wiki/Special:Redirect/file/Weather_icon_-_fog.svg" "life-fog-cc0.svg"

          cat > "$OUT/README-LICENSES.md" <<'EOF'
          # Japanese Life Motion Assets

          Web-sourced candidates for subtle motion in the Japanese Fuji scene.

          - life-petal.svg — Nevit Dilmen — CC BY-SA 3.0 / GFDL
            https://commons.wikimedia.org/wiki/File:Petal.svg
          - life-simple-petal.svg — TheTraveller60 — CC BY-SA 4.0
            https://commons.wikimedia.org/wiki/File:Simple_petal.svg
          - life-crane-illustration-cc0.svg — Francis Akuka / Wikimedia Foundation — CC0 1.0
            https://commons.wikimedia.org/wiki/File:Crane_illustration.svg
          - life-bird-flying-pinhead-cc0.svg — Wikimedia Commons — CC0 1.0
            https://commons.wikimedia.org/wiki/File:Bird_flying_Pinhead_icon.svg
          - life-bird-template-public-domain.svg — Public domain
            https://commons.wikimedia.org/wiki/File:Bird_template.svg
          - life-flight-silhouettes.svg — L. Shyamal — CC BY-SA 2.5
            https://commons.wikimedia.org/wiki/File:FlightSilhouettes.svg
          - life-bird01.svg — Lionel Allorge — CC BY-SA 3.0 / GFDL
            https://commons.wikimedia.org/wiki/File:Bird01.svg
          - life-fog-cc0.svg — Open Clip Art / gnokii — CC0 / public domain
            https://commons.wikimedia.org/wiki/File:Weather_icon_-_fog.svg

          Motion plan:
          - 4–8 tiny petals total, slow fall, low opacity.
          - 1 crane OR 2–3 tiny birds only, far behind Fuji.
          - fog SVG is a reference/mask; final mist should be translucent gradients.
          - keep branch sway anchored at the branch base.
          - never animate a whole blossom/cutout as a flying object.
          EOF

          echo "Collected files:"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload life-motion asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: japanese-life-motion-assets
          path: japanese-life-motion-assets/
          if-no-files-found: error
          retention-days: 7
